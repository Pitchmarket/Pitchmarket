name: Test football-data squads (temporary)
"on":
  push:
    branches: [test-squads]
    paths: ['.github/workflows/test-squads.yml']
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Save squads for each league
        env:
          KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          node -e '
          const codes = ["PL","PD","SA","BL1","FL1","ELC","PPL","DED","BSA"];
          (async () => {
            const out = {};
            for (const c of codes) {
              const r = await fetch("https://api.football-data.org/v4/competitions/" + c + "/teams", { headers: { "X-Auth-Token": process.env.KEY } });
              if (!r.ok) { console.log(c, "HTTP", r.status); continue; }
              const d = await r.json();
              out[c] = (d.teams || []).map(t => ({ id: t.id, name: t.name, shortName: t.shortName, squad: (t.squad || []).map(p => ({ id: p.id, name: p.name, position: p.position, dateOfBirth: p.dateOfBirth, nationality: p.nationality })) }));
              console.log(c, out[c].length, "teams");
              await new Promise(r => setTimeout(r, 7000));
            }
            require("fs").writeFileSync("squads.json", JSON.stringify(out));
          })();'
      - name: Commit squads.json to this temporary branch
        run: |
          git init -q b && cd b && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin test-squads && git checkout -q -b test-squads FETCH_HEAD
          cp ../squads.json . && git add squads.json
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Squads snapshot for testing"
          git push -q origin test-squads
