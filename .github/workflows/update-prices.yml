name: Update PitchMarket prices

"on":
  schedule:
    # Runs at minute 7 past every hour (UTC). Hourly keeps the trading
    # lock short: a club unlocks within about an hour of full time, once
    # its result is priced. Only new results go to the AI, so running
    # more often doesn't use more AI quota.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'How many days back to check (use 14 for a catch-up run after fixing team names)'
        required: false
        default: '3'
      ai_min_gap_ms:
        description: 'Milliseconds between AI calls. Raise to 8000 if the log shows HTTP 429 rate limits.'
        required: false
        default: '4500'
      ai_batch_size:
        description: 'Matches priced per AI call. 10 is the default. Lower it if replies come back incomplete.'
        required: false
        default: '10'

# Never run two updates at once: an overlapping run could price the same
# match twice. A run that starts while another is going waits for it.
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    # Pacing the AI calls makes a busy matchday take a few minutes rather
    # than seconds. This ceiling just stops a stuck run billing all day.
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run price updater
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          # How many matches go into a single AI request. One call per
          # matchday instead of one per match — a 10-match Saturday costs
          # one request, not ten, which is what keeps a real matchday inside
          # the free tier's daily cap. Set to 1 for one call per match.
          AI_BATCH_SIZE: ${{ github.event.inputs.ai_batch_size || '10' }}
          # Minimum gap between AI calls, to stay under the per-minute cap.
          # With batching there are far fewer calls, so this costs very
          # little time overall.
          AI_MIN_GAP_MS: ${{ github.event.inputs.ai_min_gap_ms || '4500' }}
          # Auto-apply prices without approval. Set to 'false' to review
          # every change by hand instead. Moves larger than
          # AUTO_APPLY_MAX_PCT are always held for review either way.
          AUTO_APPLY: 'true'
          AUTO_APPLY_MAX_PCT: '8'
          # To switch to Claude later: change AI_PROVIDER above to "claude",
          # add an ANTHROPIC_API_KEY secret, and uncomment the line below.
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node update-prices.js

  # Opens one GitHub issue when the updater has failed 3 runs in a row, so
  # someone hears about it (GitHub emails the repo's watchers about new
  # issues), and closes it once a run succeeds again. A one-off failure,
  # like the AI provider being briefly overloaded, doesn't trigger it.
  alert:
    needs: update-prices
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or close the "Price updater is failing" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.update-prices.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Price updater is failing"
          OPEN=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)

          if [ "$RESULT" = "success" ]; then
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --comment "Working again: $RUN_URL succeeded."
              echo "Closed issue #$OPEN."
            fi
            exit 0
          fi
          # A cancelled or skipped run says nothing about the updater.
          if [ "$RESULT" != "failure" ]; then exit 0; fi

          # This run failed. Alert only if the two runs before it failed too.
          PREV=$(gh run list --workflow update-prices.yml --limit 10 --json databaseId,status,conclusion \
            --jq "[.[] | select(.databaseId != $RUN_ID and .status == \"completed\") | .conclusion] | .[0:2] | join(\",\")")
          if [ "$PREV" != "failure,failure" ]; then
            echo "Failed, but not three runs in a row (previous: ${PREV:-none}). No alert."
            exit 0
          fi
          if [ -n "$OPEN" ]; then
            echo "Issue #$OPEN is already open."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "The price updater has failed three runs in a row, so match results aren't being priced and clubs that have played stay paused for trading (for up to 72 hours).

          Latest failed run: $RUN_URL

          Open it, click **update-prices**, and scroll to the end of the log. Common causes:
          - **AI quota or outage:** look for HTTP 429 or 503 from Gemini. These usually clear on their own.
          - **football-data.org errors:** look for \"football-data.org error\".
          - **A missing or expired secret:** look for \"Missing a required environment variable\".

          This issue closes itself when a run succeeds."
          echo "Opened an issue."
