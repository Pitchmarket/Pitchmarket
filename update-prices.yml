name: Update PitchMarket prices

"on":
  schedule:
    # Runs at minute 0 past every 6th hour (UTC). Change the "*/6" to
    # run more or less often — e.g. "*/3" for every 3 hours.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'How many days back to check (use 14 for a catch-up run after fixing team names)'
        required: false
        default: '3'
      ai_min_gap_ms:
        description: 'Milliseconds between AI calls. Raise to 8000 if the log shows HTTP 429 rate limits.'
        required: false
        default: '4500'
      ai_batch_size:
        description: 'Matches priced per AI call. 10 is the default. Lower it if replies come back incomplete.'
        required: false
        default: '10'

jobs:
  update-prices:
    runs-on: ubuntu-latest
    # Pacing the AI calls makes a busy matchday take a few minutes rather
    # than seconds. This ceiling just stops a stuck run billing all day.
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run price updater
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          # How many matches go into a single AI request. One call per
          # matchday instead of one per match — a 10-match Saturday costs
          # one request, not ten, which is what keeps a real matchday inside
          # the free tier's daily cap. Set to 1 for one call per match.
          AI_BATCH_SIZE: ${{ github.event.inputs.ai_batch_size || '10' }}
          # Minimum gap between AI calls, to stay under the per-minute cap.
          # With batching there are far fewer calls, so this costs very
          # little time overall.
          AI_MIN_GAP_MS: ${{ github.event.inputs.ai_min_gap_ms || '4500' }}
          # Auto-apply prices without approval. Set to 'false' to review
          # every change by hand instead. Moves larger than
          # AUTO_APPLY_MAX_PCT are always held for review either way.
          AUTO_APPLY: 'true'
          AUTO_APPLY_MAX_PCT: '8'
          # To switch to Claude later: change AI_PROVIDER above to "claude",
          # add an ANTHROPIC_API_KEY secret, and uncomment the line below.
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node update-prices.js
